# Lakehouse checks: PySpark unit tests for the silver transformations, and a dbt parse of the gold project for
# Databricks (catches SQL/Jinja and YAML errors without a workspace). The full build against the real data runs
# with scripts/run_local.py (local Spark) and on Databricks with `databricks bundle run`.
name: Databricks lakehouse checks

on:
  push:
    paths: ["databricks/**", ".github/workflows/databricks-ci.yml"]
  pull_request:
    paths: ["databricks/**", ".github/workflows/databricks-ci.yml"]
  workflow_dispatch:

jobs:
  pyspark-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: databricks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyspark==4.0.1" "pytest>=8"
      - run: pytest -q tests

  dbt-parse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: databricks/dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-databricks>=1.10,<2.0"
      - run: dbt parse --profiles-dir . --target databricks
      - run: python ../scripts/build_dashboard.py && git diff --exit-code ../dashboards
